name: ampara-integration
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ampara_integration
      POSTGRES_USER: ampara
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Execute npm run integration:setup primeiro}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - integration_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampara -d ampara_integration"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  integration_postgres:
