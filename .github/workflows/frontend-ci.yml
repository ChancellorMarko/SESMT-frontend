name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_API_MODE: demo

jobs:
  verify:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright Chromium demonstration (${{ matrix.shard }}/3)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # An empty channel selects Playwright's managed Chromium in the local config.
      PLAYWRIGHT_CHANNEL: ''
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser tests against the demonstration
        id: e2e
        # Run every scenario across independent runners without shortening failure diagnostics.
        run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/3 --workers=2 --forbid-only --reporter=line,html --global-timeout=1500000

      - name: Verify API-mode connection UI using controlled HTTP responses
        if: ${{ matrix.shard == 1 }}
        run: npm run test:connection-ui -- --forbid-only

      - name: Save failure report, screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            test-results-connection-ui/
          if-no-files-found: ignore
          retention-days: 7
